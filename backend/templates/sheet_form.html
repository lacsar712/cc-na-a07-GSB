{% extends "base.html" %}
{% block body %}
<h1>留存新对照单</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form class="card" method="post">
  {% csrf_token %}
  <label>实测甲</label>
  <select name="left_id">
    {% for row in inspections %}
      <option value="{{ row.pk }}">{{ row.aid_code }}（实测 {{ row.measured_cd|floatformat:"-1" }}，{{ row.verdict }}）</option>
    {% endfor %}
  </select>
  <label>实测乙</label>
  <select name="right_id">
    {% for row in inspections %}
      <option value="{{ row.pk }}">{{ row.aid_code }}（实测 {{ row.measured_cd|floatformat:"-1" }}，{{ row.verdict }}）</option>
    {% endfor %}
  </select>
  <button type="submit">留存对照单</button>
</form>
<p>亮度差与偏角差由服务端在留存时算好并写入存档，之后不随实测改正而变。</p>
{% endblock %}
